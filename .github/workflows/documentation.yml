name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Doxygen 1.14.0
      run: |
        wget https://www.doxygen.nl/files/doxygen-1.14.0.linux.bin.tar.gz
        tar -xzf doxygen-1.14.0.linux.bin.tar.gz
        sudo mv doxygen-1.14.0/bin/doxygen /usr/local/bin/doxygen

    - run: doxygen --version

    - name: Generate Doxygen documentation
      run: |
        doxygen Doxyfile

    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: graphics/docs

  publish-docs:
    needs: build-docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download docs artifact
      uses: actions/download-artifact@v4
      with:
        name: docs-html
        path: docs_html

    - name: Deploy documentation to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs_html
        destination_dir: docs
